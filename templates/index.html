<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidian RAG Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 30px;
            border-left: 4px solid #ffd700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .info-box h3 {
            color: #667eea;
            font-size: 1rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-box p {
            color: #555;
            font-size: 0.9rem;
            line-height: 1.6;
            margin: 0;
        }

        .info-box ul {
            margin: 8px 0 0 20px;
            color: #555;
            font-size: 0.9rem;
        }

        .info-box li {
            margin: 4px 0;
        }

        .search-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .search-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        #queryInput {
            flex: 1;
            padding: 15px 20px;
            font-size: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s;
        }

        #queryInput:focus {
            border-color: #667eea;
        }

        .search-button {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .search-button:active {
            transform: translateY(0);
        }

        .search-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .options {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #666;
        }

        .options label {
            font-weight: 500;
        }

        .options input[type="number"] {
            width: 80px;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .results.show {
            display: block;
        }

        .answer-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .answer-box h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .answer-content {
            line-height: 1.8;
            color: #333;
            font-size: 1.05rem;
            white-space: pre-wrap;
        }

        .usage-info {
            margin-top: 20px;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #555;
        }

        .usage-info h3 {
            color: #667eea;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .usage-stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .usage-stat {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .usage-stat strong {
            color: #667eea;
        }

        .sources-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .sources-box h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .source-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            transition: transform 0.2s;
        }

        .source-item:hover {
            transform: translateX(5px);
        }

        .source-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .source-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .source-number {
            font-weight: 600;
            color: #667eea;
            font-size: 1.1rem;
        }

        .source-filename {
            font-size: 0.85rem;
            color: #888;
            font-family: monospace;
        }

        .source-tags {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .tag-badge {
            background: #e0e7ff;
            color: #667eea;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .source-score {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .source-text {
            color: #555;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Obsidian RAG Search</h1>
            <p>당신의 노트에서 GPT-5 mini가 답변을 찾아드립니다</p>
        </div>

        <div class="info-box">
            <h3>💡 검색 방식 안내</h3>
            <p>
                <strong>1단계:</strong> 벡터 검색으로 <strong>전체 359개 노트</strong>를 검색하여 관련성 점수 계산<br>
                <strong>2단계:</strong> 가장 관련성 높은 <strong>상위 N개</strong>를 선택<br>
                <strong>3단계:</strong> 선택된 노트만 GPT-5 mini에 전달하여 답변 생성
            </p>
        </div>

        <div class="search-box">
            <div class="search-input-group">
                <input 
                    type="text" 
                    id="queryInput" 
                    placeholder="질문을 입력하세요... (예: #painpoint 태그가 있는 문서를 찾아줘)"
                    onkeypress="if(event.key === 'Enter') searchNotes()"
                >
                <button class="search-button" onclick="searchNotes()">검색</button>
            </div>
            <div class="options">
                <label>GPT에 전달할 노트 개수:</label>
                <input type="number" id="topK" value="3" min="1" max="10">
                <span style="font-size: 0.9rem; color: #999;">(전체 노트 검색 후 관련성 높은 상위 N개만 GPT에 전달)</span>
            </div>
        </div>

        <div class="error" id="errorBox"></div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>노트를 검색하고 답변을 생성하는 중...</p>
        </div>

        <div class="results" id="results">
            <div class="answer-box">
                <h2>💡 GPT-4 답변</h2>
                <div class="answer-content" id="answerContent"></div>
            </div>

            <div class="sources-box">
                <h2>📚 참조한 노트</h2>
                <div id="sourcesContent"></div>
            </div>
        </div>
    </div>

    <script>
        async function searchNotes() {
            const query = document.getElementById('queryInput').value.trim();
            const topK = parseInt(document.getElementById('topK').value);
            
            if (!query) {
                showError('질문을 입력해주세요.');
                return;
            }

            // UI 상태 변경
            document.getElementById('loading').classList.add('show');
            document.getElementById('results').classList.remove('show');
            document.getElementById('errorBox').classList.remove('show');
            document.querySelector('.search-button').disabled = true;

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        top_k: topK
                    })
                });

                const data = await response.json();

                if (data.success) {
                    displayResults(data.data);
                } else {
                    showError(data.error || '검색 중 오류가 발생했습니다.');
                }
            } catch (error) {
                showError('서버 연결에 실패했습니다: ' + error.message);
            } finally {
                document.getElementById('loading').classList.remove('show');
                document.querySelector('.search-button').disabled = false;
            }
        }

        function displayResults(data) {
            // 답변 표시
            document.getElementById('answerContent').textContent = data.answer;

            // 토큰 사용량 및 처리 시간 표시
            let usageHtml = '';
            if (data.usage) {
                usageHtml = `
                    <div class="usage-info">
                        <h3>📊 쿼리 정보</h3>
                        <div class="usage-stats">
                            <div class="usage-stat">
                                <span>💬 Prompt 토큰:</span>
                                <strong>${data.usage.prompt_tokens.toLocaleString()}</strong>
                            </div>
                            <div class="usage-stat">
                                <span>🤖 Completion 토큰:</span>
                                <strong>${data.usage.completion_tokens.toLocaleString()}</strong>
                            </div>
                            <div class="usage-stat">
                                <span>💰 총 토큰:</span>
                                <strong>${data.usage.total_tokens.toLocaleString()}</strong>
                            </div>
                            <div class="usage-stat">
                                <span>⏱️ 처리 시간:</span>
                                <strong>${data.elapsed_time ? data.elapsed_time.toFixed(2) : 'N/A'}초</strong>
                            </div>
                        </div>
                    </div>
                `;
            }
            document.getElementById('answerContent').innerHTML = 
                `<div style="white-space: pre-wrap;">${escapeHtml(data.answer)}</div>` + usageHtml;

            // 참조 노트 표시
            const sourcesHtml = data.sources.map(source => `
                <div class="source-item">
                    <div class="source-header">
                        <div class="source-info">
                            <span class="source-number">노트 ${source.id}</span>
                            <span class="source-filename">📄 ${escapeHtml(source.filename)}</span>
                            ${source.tags && source.tags.length > 0 ? `
                                <div class="source-tags">
                                    ${source.tags.map(tag => `<span class="tag-badge">#${escapeHtml(tag)}</span>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                        <span class="source-score">유사도: ${(source.score * 100).toFixed(1)}%</span>
                    </div>
                    <div class="source-text">${escapeHtml(source.text)}...</div>
                </div>
            `).join('');

            document.getElementById('sourcesContent').innerHTML = sourcesHtml;
            document.getElementById('results').classList.add('show');
        }

        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = '❌ ' + message;
            errorBox.classList.add('show');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Enter 키로 검색
        document.getElementById('queryInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                searchNotes();
            }
        });
    </script>
</body>
</html>
